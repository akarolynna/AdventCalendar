<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/imagens/img-layout-site/arvore-de-natal.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/cards.css">
    <link rel="stylesheet" href="./css/menu.css">
    <link rel="stylesheet" href="./css/cabecalho.css">
    <link rel="stylesheet" href="./css/index.css">
    <title>Calendário do Advento</title>
</head>

<body>
    <div class="fundo">

        <header>
            <div class="logo">
            </div>
            <nav class="menu-links" id="menu-links">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#inicio">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#sobre-advento">Sobre o Advento</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#mensagens">Mensagens</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Compartilhe</a>
                    </li>
                </ul>
            </nav>
            <div class="msg-menu">
                <div class="texto">
                    <p>Um coração preparado para a chegada de Jesus</p>
                </div>
                <div class="desenho-coracao">
                    <svg width="2.3rem" height="2.3rem" viewBox="0 0 100 100">
                        <path d="M50 88 C42 80 10 56 10 32 C10 8 40 5 50 29  C60 5 90 8 90 32  C90 56 58 80 50 88 Z"
                            fill="white" stroke="#a91817" stroke-width="0.5rem"></path>
                    </svg>
                </div>
            </div>
        </header>
        <main>

            <section class="cabecalho">
                <div class="cabecalho-calendario">

                    <h1 class="titulo-calendario">
                        <span class="titulo-menor">Calendário do</span>

                        <span class="titulo-advento">
                            <img src="./assets/imagens/img-layout-site/Ramo de azevinho natalino com frutos vermelhos.png"
                                class="decoracao esquerda" alt="">

                            <img src="./assets/imagens/img-layout-site/Advento em Vermelho Vibrante.png"
                                class="imagem-advento" alt="Advento">

                            <img src="./assets/imagens/img-layout-site/Ramo de azevinho natalino com frutas vermelhas.png"
                                class="decoracao direita" alt="">
                        </span>
                    </h1>

                    <p class="subtitulo-advento">
                        24 dias para renovar o coração<br> para o Natal.
                    </p>
                    <div class="estrela">
                        <hr class="linha"> <i class="bi bi-star-fill"></i>
                        <hr class="linha">
                    </div>
                </div>

                <div class="versiculo">
                    <p>"Eis que a virgem conceberá e dará à luz um filho e chamá-lo-ão pelo nome de EMANUEL, que
                        traduzido
                        é:
                        Deus conosco." <br>
                        <strong>Mateus 1:23</strong>
                    </p>
                    <button class="ler-versiculo-dia"> <i class="bi bi-book"></i> Ler versículo do dia</button>
                </div>

                <div class="imagem">
                    <img src="./assets/imagens/img-layout-site/novo.png" alt="Presépio com Estrela e Nuvem Suave">
                </div>


            </section>

    </div>
    <section class="calendario" id="calendario">
        <div class="grade-calendario">

        </div>

    </section>
    </main>

    <script src="./js/cards.js"></script>
</body>

</html>
